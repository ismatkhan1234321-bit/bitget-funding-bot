name: Rule7 Bot - 5 Min

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install ccxt pandas
      - run: ls -la && ls -la *.py *.pay || true
      - run: python Rule7_bot.py --scan
      - run: python Rule7_bot.py --history
