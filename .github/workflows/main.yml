name: Funding Bot
on:
  schedule:
    - cron: '0 */3 * * *'  # JAAN NAYA - Har 3 ghante me 1 baar (15 min se change)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # JAAN NAYA - Node 20 deprecated tha, 22 kar diya
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - run: npx tsx scripts/src/funding-bot.ts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
