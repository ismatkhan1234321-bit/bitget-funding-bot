name: Rule7 Bot.pay - 5 Min Scanner

on:
  schedule:
    - cron: '*/5 * * * *'  # Har 5 minute me chalega
  workflow_dispatch:  # Manual bhi chala sakte ho

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install ccxt pandas
          
      - name: Run Rule7 Scanner - Current
        run: |
          python Rule7_bot.py --scan
          
      - name: Run Rule7 Scanner - 24h History
        run: |
          python Rule7_bot.py --history
