name: Liquidity Sweep Telegram Alerter

on:
  schedule:
    - cron: '*/5 * * * *' # Har 5 minute me chalega
  workflow_dispatch: # Manual run ke liye

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests
        
      - name: Run Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python Rule7_bot.py  # <--- Yahan Rule7_bot.py kar diya hai
        
      - name: Commit state file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add telegram_state.json || true
          git commit -m "Update state" || true
          git push || true
